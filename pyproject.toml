[build-system]
requires = ["setuptools>=77", "wheel", "pybind11>=2.12", "ziglang; platform_system == \"Windows\""]
build-backend = "setuptools.build_meta"

[project]
name = "lme4"
version = "2.1.0a2"
description = "Linear, generalized linear and nonlinear mixed-effects models: a faithful, R-independent Python transcription of the R package lme4, with a C++ (Eigen) backend"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "pandas>=1.5", "nlopt>=2.7"]
authors = [
  { name = "Douglas Bates" }, { name = "Martin Maechler" }, { name = "Ben Bolker" },
  { name = "Steven Walker" }, { name = "lme4 contributors" },
  { name = "Leonardo Jofré Flor", email = "ljofre2146@gmail.com" },
]
maintainers = [{ name = "Leonardo Jofré Flor", email = "ljofre2146@gmail.com" }]
keywords = ["mixed models", "lme4", "lmer", "glmer", "random effects", "multilevel models",
            "hierarchical models", "GLMM", "statistics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/ljofreflor/lme4"
Source = "https://github.com/ljofreflor/lme4"
Issues = "https://github.com/ljofreflor/lme4/issues"
"Original R package" = "https://github.com/lme4/lme4"

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
test = ["pytest", "matplotlib>=3.5", "nbformat", "nbclient", "ipykernel"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lme4 = ["_fgq_rules.json", "datasets/*.csv.gz", "datasets/_factors.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-win32 *-manylinux_i686 *-musllinux_*"
# NumPy 2 wheels need glibc >= 2.28
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
test-requires = ["pytest"]
# test against the installed wheel (override pythonpath=src from the pytest config)
test-command = "pytest -q -p no:cacheprovider -W ignore -o pythonpath= {project}/tests/test_lmer.py {project}/tests/test_glmer.py {project}/tests/test_reference.py"
# run the (slower) tests only on one Python version per platform
test-skip = "cp39-* cp310-* cp311-* cp313-*"
